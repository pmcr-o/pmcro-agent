name: validate
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python eng/validate.py
      - name: Run PMCR-O tutorial
        shell: pwsh
        run: ./eng/run-tutorial.ps1 -RunId ci-tutorial-${{ github.run_id }}
